appId: io.github.codex-router.control-center
productName: Codex Router
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
electronFuses:
  # The packaged Electron executable intentionally runs the trusted installed
  # router entrypoints in Node mode; command-runner.mjs depends on this fuse.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraResources:
  - from: assets/icon.png
    to: icon.png
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target: [dmg, zip]
linux:
  icon: assets/icon.png
  category: Development
  executableName: codex-router-control-center
  target: [AppImage]
win:
  icon: assets/icon.ico
  target: [nsis]
nsis:
  # The installer-created Start Menu link is briefly replaced during an
  # in-place update. Launching through that link in the installer's final
  # frame can race the replacement on Windows, so the updater owns no launch;
  # our update flow starts the installed executable directly after it exits.
  runAfterFinish: false
